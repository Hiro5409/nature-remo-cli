version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      bun-dependencies:
        patterns:
          - "*"
    ignore:
      # Dependabot ranks the pinned `next` snapshot below older stable releases.
      - dependency-name: "@hey-api/openapi-ts"
      # Vite+ moves together with its `vite` alias and overrides, which Dependabot leaves unchanged.
      - dependency-name: vite-plus
      # Node.js type definitions follow the oldest supported Node.js major.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
