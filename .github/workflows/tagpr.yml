name: tagpr

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    name: Prepare release pull request or tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Push the release pull request branch and the release tag.
      issues: read # Read labels used to select the next version.
      pull-requests: write # Create and update the release pull request.
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tagpr
        id: tagpr
        uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Start release
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch the Release workflow.
    steps:
      # A tag pushed with GITHUB_TOKEN starts no workflow; a workflow_dispatch event does.
      - name: Run the Release workflow from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
