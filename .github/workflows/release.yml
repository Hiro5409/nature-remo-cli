name: Release

on:
  push:
    tags:
      - "v*"
  # Finishes a release from its tag once its staged version is approved on npm, or retries a failed run.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "$GITHUB_REF is not refs/tags/v$version, the tag for the version in package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tagged commit is not on main."
            exit 1
          fi

  check:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download tested npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Inspect publication state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.ts "$RUNNER_TEMP"/package/*.tgz
      # The trusted publisher's token cannot see staged versions, so staging one that already awaits approval fails here.
      - name: Stage tested npm artifact
        if: steps.state.outputs.npmPublished == 'false'
        working-directory: ${{ runner.temp }}/package
        run: |
          npm stage publish ./*.tgz --provenance --access public
          echo "::notice::Staged $GITHUB_REF_NAME on npm. Approve it there, then run this workflow again from the tag to create the GitHub Release."
      - name: Create GitHub Release
        if: steps.state.outputs.npmPublished == 'true' && steps.state.outputs.releaseExists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
      - name: Attach tested npm artifact
        if: steps.state.outputs.npmPublished == 'true' && steps.state.outputs.assetExists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/package/*.tgz
